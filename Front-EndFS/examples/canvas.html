<html>
    <head><title>Canvas Example</title></head>
    <style>
        #canvas{
            border: 2px solid black;
        }
    </style>
    </head>
    <body>
        <article>
            <h2>This is canvas</h2>

            <label>Choose Color: </label>
            <input type="color" id="colorPicker" value="#000000">
            <label>Choose Thickness: </label>
            <input type="range" id="thickness" min="1" max="10" value="1">
            <br/><br/>
            
            <canvas id="canvas" width="800" height="200" onmousedown="startDrawing(event)" onmousemove="drawLine(event)"
            onmouseup="stopDrawing(event)"></canvas>
        </article>
            <button onclick="ctx.clearRect(0,0,canvas.width,canvas.height)">Clear Canvas</button>

        <script>
        var canvas = document.getElementById("canvas");
        var ctx = canvas.getContext("2d");
        var isDrawing = false;
        
        function startDrawing(event){
            isDrawing = true;

            ctx.strokeStyle = colorPicker.value;   // color
            ctx.lineWidth = thickness.value;       // thickness
            ctx.lineCap = "round";

            
            
            var x = event.clientX-canvas.offsetLeft;
            var y = event.clientY-canvas.offsetTop;
            ctx.beginPath();
            ctx.moveTo(x,y);
        }
        
        function drawLine(event){
            if(isDrawing){
                var x = event.clientX-canvas.offsetLeft;
                var y = event.clientY-canvas.offsetTop;
                ctx.lineTo(x,y);
                ctx.stroke();
            }
        }
        
        function stopDrawing(event){
            isDrawing = false;
        }
        </script>

</body>

</html>
